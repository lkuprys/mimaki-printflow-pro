name: CI

# Senoji PrintFlow PRO programa. PrintFlow Lite turi savo CI („PrintFlow Lite (Windows EXE)“).
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "PrintFlow Lite/**"
      - ".github/workflows/printflow-lite*.yml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "PrintFlow Lite/**"
      - ".github/workflows/printflow-lite*.yml"

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Pipeline Tests
        run: |
          python test_pipeline.py

      - name: Run Desktop & QML Interface Tests
        run: |
          python test_desktop_app.py
