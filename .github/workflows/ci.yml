name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Pipeline Tests
        run: |
          python test_pipeline.py

      - name: Run Headless QML Interface Test
        run: |
          python -c "from PySide6.QtGui import QGuiApplication; from PySide6.QtQml import QQmlApplicationEngine; from PySide6.QtQuickControls2 import QQuickStyle; from printflow.ui.controllers import PrintFlowController; app = QGuiApplication(['test']); QQuickStyle.setStyle('Basic'); ctrl = PrintFlowController(); engine = QQmlApplicationEngine(); engine.rootContext().setContextProperty('printflowController', ctrl); engine.load('printflow/ui/qml/Main.qml'); assert len(engine.rootObjects()) > 0; print('CI QML Validation: PASSED!')"
