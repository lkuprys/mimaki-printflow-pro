name: PrintFlow Lite (Windows EXE)

on:
  push:
    paths:
      - "PrintFlow Lite/**"
      - ".github/workflows/printflow-lite.yml"
      - ".github/workflows/printflow-lite-release.yml"
  pull_request:
    paths:
      - "PrintFlow Lite/**"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "PrintFlow Lite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_lite.txt pytest pyinstaller

      - name: End-to-end tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          PRINTFLOW_NO_AUTO_UPDATE: "1"
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Build PrintFlowLite (PyInstaller --onedir, kaip išleidime)
        run: pyinstaller --noconfirm --clean --onedir --windowed --name PrintFlowLite --icon assets/podbase.ico --paths . --add-data "fonts;fonts" --add-data "assets;assets" --distpath dist --workpath build main_lite.py

      - name: Package test ZIP
        run: python tools/package_release.py --version 0.0.0-ci

      - name: Smoke test compiled EXE (starts without admin, creates config + log)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pfl_smoke"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive -Path "dist/PrintFlowLite_v0.0.0-ci.zip" -DestinationPath $dir
          $app = Join-Path $dir "PrintFlowLite"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PRINTFLOW_NO_AUTO_UPDATE = "1"
          $p = Start-Process -FilePath (Join-Path $app "PrintFlowLite.exe") -WorkingDirectory $app -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "PrintFlowLite.exe baigesi per anksti (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path (Join-Path $app "config.json"))) { throw "config.json nesukurtas" }
          $log = Get-Content (Join-Path $app "printflow_lite.log") -Encoding UTF8 -Raw
          if ($log -notmatch "paleista") { throw "zurnale nera starto irasu" }
          $cfg = Get-Content (Join-Path $app "config.json") -Raw | ConvertFrom-Json
          if ($cfg.auto_scan -ne $false) { throw "auto_scan turi buti false" }
          Write-Host "EXE smoke test OK"

      - name: Upload PrintFlowLite (bandomasis paketas)
        uses: actions/upload-artifact@v4
        with:
          name: PrintFlowLite-Windows-x64
          path: PrintFlow Lite/dist/PrintFlowLite_v0.0.0-ci.zip
          retention-days: 30
