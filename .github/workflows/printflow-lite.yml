name: PrintFlow Lite (Windows EXE)

on:
  push:
    paths:
      - "PrintFlow Lite/**"
      - ".github/workflows/printflow-lite.yml"
  pull_request:
    paths:
      - "PrintFlow Lite/**"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "PrintFlow Lite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_lite.txt pytest pyinstaller

      - name: End-to-end tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Build PrintFlowLite.exe (PyInstaller --onefile --windowed)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PrintFlowLite --paths . --distpath dist --workpath build main_lite.py

      - name: Smoke test compiled EXE (starts without admin, creates config + log)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pfl_smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\PrintFlowLite.exe $dir
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath (Join-Path $dir "PrintFlowLite.exe") -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "PrintFlowLite.exe baigesi per anksti (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path (Join-Path $dir "config.json"))) { throw "config.json nesukurtas" }
          $log = Get-Content (Join-Path $dir "printflow_lite.log") -Encoding UTF8 -Raw
          if ($log -notmatch "Automatinis steb") { throw "zurnale nera starto irasu" }
          $cfg = Get-Content (Join-Path $dir "config.json") -Raw | ConvertFrom-Json
          if ($cfg.auto_scan -ne $false) { throw "auto_scan turi buti false" }
          Write-Host "EXE smoke test OK"

      - name: Upload PrintFlowLite.exe
        uses: actions/upload-artifact@v4
        with:
          name: PrintFlowLite-Windows-x64
          path: |
            PrintFlow Lite/dist/PrintFlowLite.exe
            PrintFlow Lite/config.json
            PrintFlow Lite/README.md
          retention-days: 30
