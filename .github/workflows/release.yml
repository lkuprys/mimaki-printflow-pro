name: Build and Release Windows Exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Set up C++ Compiler (MSVC 64-bit)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Standalone Windows Executable with Nuitka
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --enable-plugin=pyside6 `
            --include-qt-plugins=sensible,qml `
            --include-data-dir=printflow/ui/qml=printflow/ui/qml `
            --include-data-dir=printflow/config=printflow/config `
            --output-filename=PrintFlow.exe `
            main.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path PrintFlow.exe, README.md -DestinationPath PrintFlow-Windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 PrintFlow-Windows-x64.zip).Hash
          "$hash  PrintFlow-Windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PrintFlow-Windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
